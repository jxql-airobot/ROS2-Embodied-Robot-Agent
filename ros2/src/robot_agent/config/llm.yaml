# LLM provider config for robot_agent
# provider: mock | deepseek | openai
#   mock     : deterministic rule-based parser, works offline (default)
#   deepseek : DeepSeek chat completions (OpenAI-compatible)
#   openai   : any OpenAI-compatible chat completions endpoint
provider: mock
model: deepseek-chat
base_url: https://api.deepseek.com/v1
api_key_env: DEEPSEEK_API_KEY
temperature: 0.0
timeout: 20.0
